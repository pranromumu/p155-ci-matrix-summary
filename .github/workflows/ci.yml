name: CI Matrix Summary

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest
        run: pytest -v -s

      - name: Summary - Pass
        if: success()
        run: |
          echo "## CI Matrix Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "Python ${{ matrix.python-version }} → PASS ✅" >> $GITHUB_STEP_SUMMARY

      - name: Summary - Fail
        if: failure()
        run: |
          echo "## CI Matrix Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "Python ${{ matrix.python-version }} → FAIL ❌" >> $GITHUB_STEP_SUMMARY

  summary:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Overall Summary
        run: |
          echo "## Overall Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "Overall result → PASS ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "Overall result → FAIL ❌" >> $GITHUB_STEP_SUMMARY
          fi